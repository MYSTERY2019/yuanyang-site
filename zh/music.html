<style>
.music{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);
       gap:clamp(28px,4.5vw,80px);align-items:start}
.music .left{display:flex;flex-direction:column;gap:clamp(16px,2.4vh,28px)}
.music h1{font-size:clamp(38px,5.2vw,74px);line-height:.98;letter-spacing:-.03em;margin:0}
.music .sub{font-size:17px;color:var(--muted);margin:0}
.music .story{max-width:46ch;margin:0}
.music .credits{margin:clamp(20px,4vh,52px) 0 0;font-size:15px;color:var(--muted)}
.music .credits p{margin:0;line-height:1.75}
.music .credits a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.sleeve{margin:0}
.sleeve img{display:block;width:100%;height:auto}
.music .p2-btn{background:var(--red);border-color:var(--red);color:var(--paper)}
.music .p2-btn:hover,.music .p2-btn:focus-visible{background:var(--ink);border-color:var(--ink);color:var(--paper)}
@media (max-width:880px){
  .music{grid-template-columns:1fr}
  .sleeve{order:-1}
}

        <div class="player2 rise" data-src="../assets/xiao-chenpi-web.mp3" data-label="写给小陈皮">

          <div class="p2-track"><input type="range" min="0" max="100" value="0" step="0.1" aria-label="进度"></div>

        <p class="story rise">目前只有这一首。夏天的体育馆，还欠彼此的那座山，窗台上睡着的猫，还有从光山到上海的这一路。</p>
        <div class="credits rise">
          <p>作词：Yuanyang、DeepSeek 和 Gemini</p>
          <p>制作：<a href="https://suno.com">Suno</a></p>
        </div>
